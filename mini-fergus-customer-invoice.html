<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solectrics Customer Invoice</title>
  <style>
    :root{color-scheme:light;--green:#173f3f;--orange:#ef9c20;--paper:#fff;--wash:#f6f3ed;--line:#ded9cf;--muted:#68746f;--soft:#f8f6f1}
    *{box-sizing:border-box}body{margin:0;background:var(--wash);color:#243536;font:14px/1.5 Arial,sans-serif}main{max-width:920px;margin:28px auto;padding:0 18px 50px}.invoice{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:38px;box-shadow:0 18px 50px rgba(23,63,63,.09)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 auto 14px;max-width:920px;padding:0 18px}.button,button{background:var(--green);border:0;border-radius:7px;color:#fff;cursor:pointer;padding:11px 16px;text-decoration:none;font-weight:700}.top{display:flex;justify-content:space-between;gap:28px;border-bottom:4px solid var(--orange);padding-bottom:20px}.logo{display:block;height:90px;width:235px;object-fit:contain;object-position:left center}.business{color:var(--muted);font-size:12px;margin-top:6px}.meta{text-align:right}.meta h1{color:var(--green);font-size:34px;line-height:1;margin:2px 0 10px}.number{font-size:17px;font-weight:800}.status{display:inline-block;background:#edf4ef;border-radius:999px;color:var(--green);font-size:11px;font-weight:900;letter-spacing:.07em;margin-top:8px;padding:5px 10px}.status.draft{background:#fff3e3;color:#9a5700}.status.void{background:#f5e8e8;color:#8b2828}.status.paid{background:#e3f3e8;color:#17633b}
    .parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:26px 0}.card{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:16px}.label{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.card strong{display:block;font-size:17px;margin:3px 0}.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.dates div{background:#fff;border:1px solid var(--line);padding:9px 11px}
    table{border-collapse:collapse;width:100%}th{background:var(--green);color:#fff;font-size:11px;letter-spacing:.05em;padding:10px;text-align:left;text-transform:uppercase}td{border-bottom:1px solid var(--line);padding:12px 10px;vertical-align:top}.number-cell{text-align:right;white-space:nowrap}.totals{margin:16px 0 0 auto;max-width:360px}.total-row{display:flex;justify-content:space-between;gap:20px;padding:7px 10px}.total-row.grand{background:#fff3e3;border-top:3px solid var(--orange);font-size:18px;font-weight:900}.payment{background:#edf4ef;border-left:5px solid var(--green);border-radius:0 10px 10px 0;margin-top:26px;padding:16px;white-space:pre-line}.notes{margin-top:18px;white-space:pre-line}.footer{border-top:1px solid var(--line);color:var(--muted);font-size:11px;margin-top:30px;padding-top:12px;text-align:center}
    @media(max-width:680px){.invoice{padding:23px 15px}.top{display:block}.meta{text-align:left;margin-top:16px}.parties{grid-template-columns:1fr}.logo{height:70px;width:195px}table{font-size:12px}th,td{padding:8px 5px}.unit-column{display:none}}
    @media print{@page{size:A4;margin:12mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}.actions{display:none}main{margin:0;max-width:none;padding:0}.invoice{border:0;border-radius:0;box-shadow:none;padding:0}}
  </style>
</head>
<body>
  <div class="actions"><a class="button" id="backLink" href="/mini-fergus">← Back to job</a><button type="button" onclick="window.print()">PRINT / SAVE PDF</button></div>
  <main><div id="content" class="invoice">Loading customer invoice…</div></main>
  <script>
    const params=new URLSearchParams(location.search);const invoiceId=params.get("invoice_id");
    const money=value=>new Intl.NumberFormat("en-NZ",{style:"currency",currency:"NZD"}).format(Number(value)||0);
    const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    const date=value=>value?new Date(`${value}T12:00:00`).toLocaleDateString("en-NZ",{day:"numeric",month:"long",year:"numeric"}):"";
    async function loadInvoice(){const content=document.getElementById("content");try{if(!invoiceId)throw new Error("Invoice ID is missing");const response=await fetch(`/api/customer-invoices?invoice_id=${encodeURIComponent(invoiceId)}`);const data=await response.json();if(!response.ok||!data.ok||!data.invoice.snapshot)throw new Error(data.error||"Invoice could not be loaded");const invoice=data.invoice,snap=invoice.snapshot,business=snap.business||{},customer=snap.customer||{},totals=snap.totals||{};document.title=`${snap.invoice_number} — Solectrics`;document.getElementById("backLink").href=`/mini-fergus-job?id=${encodeURIComponent(snap.job_id)}`;content.innerHTML=`
      <header class="top"><div><img class="logo" src="/EFEC3451-B808-452A-8EA2-64B22E36C363.png" alt="Solectrics"><div class="business"><strong>${escapeHtml(business.name||"Solectrics")}</strong><br>${(business.address||[]).map(escapeHtml).join("<br>")}<br>${escapeHtml(business.email||"")}<br>GST number: ${escapeHtml(business.gst_number||"")}</div></div><div class="meta"><h1>TAX INVOICE</h1><div class="number">${escapeHtml(snap.invoice_number)}</div><span class="status ${escapeHtml(invoice.status)}">${escapeHtml(invoice.status).toUpperCase()}</span><div class="dates"><div><span class="label">Invoice date</span><br>${date(snap.issue_date)}</div><div><span class="label">Due date</span><br>${date(snap.due_date)}</div></div></div></header>
      <section class="parties"><div class="card"><span class="label">Bill to</span><strong>${escapeHtml(customer.name)}</strong>${escapeHtml(customer.address)}<br>${escapeHtml(customer.email)}${customer.phone?`<br>${escapeHtml(customer.phone)}`:""}</div><div class="card"><span class="label">Job</span><strong>${escapeHtml(snap.job_type==="solar"?"Solar installation":"Electrical work")}</strong>Job Hub reference ${escapeHtml(snap.job_id)}</div></section>
      <table><thead><tr><th>Description</th><th>Qty</th><th class="unit-column">Unit</th><th class="number-cell">Unit price ex GST</th><th class="number-cell">Total ex GST</th></tr></thead><tbody>${(snap.lines||[]).map(line=>`<tr><td>${escapeHtml(line.description)}</td><td>${Number(line.quantity).toLocaleString("en-NZ")}</td><td class="unit-column">${escapeHtml(line.unit)}</td><td class="number-cell">${money(line.unit_price_ex_gst)}</td><td class="number-cell">${money(line.total_ex_gst)}</td></tr>`).join("")}</tbody></table>
      <div class="totals"><div class="total-row"><span>Subtotal ex GST</span><strong>${money(totals.subtotal_ex_gst)}</strong></div><div class="total-row"><span>GST (15%)</span><strong>${money(totals.gst)}</strong></div><div class="total-row grand"><span>Total incl GST</span><span>${money(totals.total_incl_gst)}</span></div></div>
      <section class="payment"><strong>Payment</strong><br>${escapeHtml(snap.payment?.terms||"")}<br>${escapeHtml(snap.payment?.instructions||"")}</section>${snap.notes?`<section class="notes"><strong>Notes</strong><br>${escapeHtml(snap.notes)}</section>`:""}<footer class="footer">${escapeHtml(business.name||"Solectrics")} · GST ${escapeHtml(business.gst_number||"")} · ${escapeHtml(business.email||"")}</footer>`;}catch(error){content.innerHTML=`<h1>Invoice unavailable</h1><p>${escapeHtml(error.message)}</p>`;}}
    loadInvoice();
  </script>
</body>
</html>
