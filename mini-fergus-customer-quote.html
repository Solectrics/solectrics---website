<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solectrics Customer Quote</title>
  <style>
    :root{color-scheme:light;--green:#173f3f;--orange:#ef9c20;--paper:#fff;--wash:#f6f3ed;--line:#ded9cf;--muted:#68746f;--theme:#ef9c20;--theme-soft:#fff3e3}
    *{box-sizing:border-box}
    body{margin:0;background:var(--wash);color:#243536;font:15px/1.55 Arial,sans-serif}
    body::before{content:"";position:fixed;inset:0;background:url("/AE6ECD78-405A-46A3-B156-354A1CB82DA3.png") center/cover no-repeat;opacity:.09;pointer-events:none;z-index:-1}
    main{max-width:940px;margin:30px auto;padding:0 18px 50px}
    .quote{position:relative;overflow:hidden;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;padding:42px;box-shadow:0 18px 50px rgba(23,63,63,.09)}
    .quote.general-electrical{--theme:#173f3f;--theme-soft:#edf3f0}
    .quote::after{content:"";position:absolute;inset:0;background:url("/AE6ECD78-405A-46A3-B156-354A1CB82DA3.png") right top/760px auto no-repeat;opacity:.045;pointer-events:none}
    .quote>*{position:relative;z-index:1}
    header{display:flex;justify-content:space-between;gap:28px;border-bottom:4px solid var(--theme);padding-bottom:22px}
    .logo{display:block;height:92px;width:240px;object-fit:contain;object-position:left center}
    .business-address{color:var(--muted);font-size:12px;margin-top:5px}
    .quote-kind{color:var(--theme);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1,h2{color:var(--green);margin:0}
    h1{font-size:30px;line-height:1.08;margin:5px 0}
    h2{font-size:21px;margin-bottom:12px}
    .meta{text-align:right}
    .meta-number{font-size:17px;font-weight:800}
    .intro-strip{background:var(--theme-soft);border-left:5px solid var(--theme);border-radius:0 10px 10px 0;margin:24px 0 0;padding:14px 17px}
    .customer{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:26px 0}
    .option{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:13px;margin:18px 0;overflow:hidden;break-inside:avoid}
    .option h2{background:var(--theme-soft);border-left:5px solid var(--theme);padding:15px 18px}
    table{border-collapse:collapse;width:100%}
    th,td{border-bottom:1px solid #ece8e0;padding:11px 14px;text-align:left}
    th{color:var(--muted);font-size:11px;text-transform:uppercase}
    .number{text-align:right;white-space:nowrap}
    .totals{margin-left:auto;width:min(100%,350px);padding:12px 16px 18px}
    .total-row{display:flex;justify-content:space-between;gap:20px;padding:5px 0}
    .grand{border-top:2px solid var(--green);font-size:19px;font-weight:800;margin-top:5px;padding-top:10px}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 auto 15px;max-width:940px;padding:0 18px}
    button,a.button{background:var(--green);border:0;border-radius:7px;color:#fff;cursor:pointer;padding:11px 16px;text-decoration:none;font-weight:700}
    a.button.secondary{background:var(--orange)}
    .notice{background:#fff4df;border-left:4px solid var(--orange);border-radius:8px;padding:12px 15px;margin-top:22px}
    .terms-link{color:var(--green);font-weight:800}
    .quote-terms{border-top:4px solid var(--theme);margin-top:42px;padding-top:30px;page-break-before:always}
    .quote-terms .eyebrow{color:var(--theme);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .quote-terms h1{font-size:28px;margin:5px 0 12px}
    .quote-terms h2{font-size:16px;margin:20px 0 5px}
    .quote-terms p{font-size:12px;line-height:1.5;margin:0 0 8px}
    .quote-terms .intro{color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:18px}
    .quote-terms .note{background:#fff4df;border-left:4px solid var(--orange);padding:10px 12px;margin-top:20px}
    .quote-footer{border-top:1px solid var(--line);color:var(--muted);font-size:11px;margin-top:28px;padding-top:14px;text-align:center}
    @media(max-width:650px){.quote{padding:25px 18px}.customer{grid-template-columns:1fr}header{display:block}.logo{height:74px;width:200px}.meta{text-align:left;margin-top:16px}th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){display:none}}
    @media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}body::before{opacity:.06}.actions{display:none}main{margin:0;max-width:none;padding:0}.quote{border:0;border-radius:0;box-shadow:none;padding:18px}.option{break-inside:avoid}.quote-terms{break-before:page}.quote::after{opacity:.035}}
  </style>
</head>
<body>
  <div class="actions"><a class="button" id="backLink" href="/mini-fergus">← Back to job</a><button type="button" onclick="window.print()">PRINT / SAVE PDF</button><a class="button secondary" href="/terms-and-conditions" target="_blank" rel="noopener">VIEW TERMS &amp; CONDITIONS</a></div>
  <main><div id="content" class="quote">Loading customer quote…</div></main>
  <script>
    const params = new URLSearchParams(location.search);
    const quoteId = params.get("quote_id");
    const money = value => new Intl.NumberFormat("en-NZ", { style:"currency", currency:"NZD" }).format(Number(value)||0);
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    async function attachTerms() {
      const target = document.getElementById("quoteTerms");
      if (!target) return;
      try {
        const response = await fetch("/terms-and-conditions.html");
        if (!response.ok) throw new Error("Terms unavailable");
        const page = new DOMParser().parseFromString(await response.text(), "text/html");
        const article = page.querySelector("article");
        if (!article) throw new Error("Terms unavailable");
        target.innerHTML = article.innerHTML;
      } catch (error) {
        target.innerHTML = `<h1>Terms &amp; Conditions</h1><p>The full terms are available at <a class="terms-link" href="/terms-and-conditions">solectrics.co.nz/terms-and-conditions</a>.</p>`;
      }
    }
    async function loadQuote() {
      const content = document.getElementById("content");
      try {
        if (!quoteId) throw new Error("Quote ID is missing");
        const response = await fetch(`/api/customer-quotes?quote_id=${encodeURIComponent(quoteId)}`);
        const data = await response.json();
        if (!response.ok || !data.ok || !data.quote.snapshot) throw new Error(data.error || "Quote could not be loaded");
        const quote = data.quote;
        const snap = quote.snapshot;
        const isElectrical = snap.template === "general_electrical" || snap.job_type === "general_electrical" || String(snap.quote_number).startsWith("SEW-");
        const templateClass = isElectrical ? "general-electrical" : "solar";
        const templateName = isElectrical ? "General Electrical Quote" : "Solar & Battery Quote";
        const templateKicker = isElectrical ? "Electrical work" : "Solar smart living";
        const templateIntro = isElectrical
          ? "A clear quotation for the electrical work described below, prepared from the approved Solectrics job costing."
          : "A tailored solar-smart proposal prepared from the approved Solectrics system design and job costing.";
        const savedAddress = snap.business?.address;
        const businessAddress = Array.isArray(savedAddress)
          ? savedAddress
          : ["39 Bay Rd", "Ostend", "Waiheke Island 1081"];
        document.title = `${snap.quote_number} — Solectrics`;
        document.getElementById("backLink").href = `/mini-fergus-job?id=${encodeURIComponent(snap.job_id)}`;
        content.className = `quote ${templateClass}`;
        content.innerHTML = `
          <header>
            <div><img class="logo" src="/EFEC3451-B808-452A-8EA2-64B22E36C363.png" alt="Solectrics"><div class="business-address">${businessAddress.map(escapeHtml).join("<br>")}</div></div>
            <div class="meta"><div class="quote-kind">${templateKicker}</div><h1>${templateName}</h1><div class="meta-number">${escapeHtml(snap.quote_number)}</div>${new Date(snap.generated_at).toLocaleDateString("en-NZ")}<br>Status: ${escapeHtml(quote.status).toUpperCase()}</div>
          </header>
          <div class="intro-strip">${templateIntro}</div>
          <section class="customer"><div><h2>Prepared for</h2><strong>${escapeHtml(snap.customer.name)}</strong><br>${escapeHtml(snap.customer.address)}</div><div><h2>Contact</h2>${escapeHtml(snap.customer.email)}<br>${escapeHtml(snap.customer.phone)}</div></section>
          ${snap.options.map(option => `<section class="option"><h2>${escapeHtml(option.name)}</h2><table><thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th class="number">Price ex GST</th></tr></thead><tbody>${option.lines.map(line => `<tr><td>${escapeHtml(line.description)}</td><td>${Number(line.quantity)}</td><td>${escapeHtml(line.unit)}</td><td class="number">${money(line.total)}</td></tr>`).join("") || `<tr><td colspan="4">Included supply and installation</td></tr>`}</tbody></table><div class="totals"><div class="total-row"><span>Subtotal ex GST</span><strong>${money(option.subtotal_ex_gst)}</strong></div><div class="total-row"><span>GST</span><strong>${money(option.gst)}</strong></div><div class="total-row grand"><span>Total incl GST</span><strong>${money(option.total_incl_gst)}</strong></div></div></section>`).join("")}
          <p class="notice">This is a saved quote version. Please contact Solectrics to accept an option or discuss changes. Acceptance is subject to the Terms &amp; Conditions attached below and available at <a class="terms-link" href="/terms-and-conditions" target="_blank" rel="noopener">solectrics.co.nz/terms-and-conditions</a>.</p>
          <section class="quote-terms" id="quoteTerms"><h1>Terms &amp; Conditions</h1><p>Loading the terms attached to this quote…</p></section>
          <footer class="quote-footer">Solectrics · 39 Bay Rd, Ostend, Waiheke Island 1081</footer>`;
        await attachTerms();
      } catch (error) { content.innerHTML = `<h1>Quote unavailable</h1><p>${escapeHtml(error.message)}</p>`; }
    }
    loadQuote();
  </script>
</body>
</html>
