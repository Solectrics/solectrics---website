<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solectrics Customer Quote</title>
  <style>
    :root { color-scheme: light; --ink:#183a3b; --orange:#ef9c20; --paper:#fff; --wash:#f6f3ed; --line:#ded9cf; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--wash); color:#243536; font:15px/1.5 Arial,sans-serif; }
    main { max-width:900px; margin:34px auto; padding:0 18px 50px; }
    .quote { background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:38px; }
    header { display:flex; justify-content:space-between; gap:24px; border-bottom:3px solid var(--orange); padding-bottom:22px; }
    .brand { color:var(--ink); font-size:31px; font-weight:800; letter-spacing:-1px; }
    h1,h2 { color:var(--ink); margin:0; }
    h1 { font-size:28px; }
    h2 { font-size:21px; margin-bottom:12px; }
    .meta { text-align:right; }
    .customer { display:grid; grid-template-columns:1fr 1fr; gap:28px; padding:26px 0; }
    .option { border:1px solid var(--line); border-radius:13px; margin:18px 0; overflow:hidden; }
    .option h2 { background:#eef2ef; padding:15px 18px; }
    table { border-collapse:collapse; width:100%; }
    th,td { border-bottom:1px solid #ece8e0; padding:11px 14px; text-align:left; }
    th { color:#68746f; font-size:11px; text-transform:uppercase; }
    .number { text-align:right; white-space:nowrap; }
    .totals { margin-left:auto; width:min(100%,330px); padding:12px 16px 18px; }
    .total-row { display:flex; justify-content:space-between; gap:20px; padding:5px 0; }
    .grand { border-top:2px solid var(--ink); font-size:18px; font-weight:700; margin-top:5px; padding-top:10px; }
    .actions { display:flex; gap:10px; margin:0 auto 15px; max-width:900px; padding:0 18px; }
    button,a.button { background:var(--ink); border:0; border-radius:7px; color:#fff; cursor:pointer; padding:10px 15px; text-decoration:none; }
    .notice { background:#fff4df; border-left:4px solid #d88b00; border-radius:8px; padding:11px 14px; }
    @media(max-width:650px) { .quote{padding:24px 18px}.customer{grid-template-columns:1fr}header{display:block}.meta{text-align:left;margin-top:14px}th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){display:none} }
    @media print { body{background:#fff}.actions{display:none}main{margin:0;max-width:none;padding:0}.quote{border:0;border-radius:0;padding:20px}.option{break-inside:avoid} }
  </style>
</head>
<body>
  <div class="actions"><a class="button" id="backLink" href="/mini-fergus">← Back to job</a><button type="button" onclick="window.print()">PRINT / SAVE PDF</button></div>
  <main><div id="content" class="quote">Loading customer quote…</div></main>
  <script>
    const params = new URLSearchParams(location.search);
    const quoteId = params.get("quote_id");
    const money = value => new Intl.NumberFormat("en-NZ", { style:"currency", currency:"NZD" }).format(Number(value)||0);
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    async function loadQuote() {
      const content = document.getElementById("content");
      try {
        if (!quoteId) throw new Error("Quote ID is missing");
        const response = await fetch(`/api/customer-quotes?quote_id=${encodeURIComponent(quoteId)}`);
        const data = await response.json();
        if (!response.ok || !data.ok || !data.quote.snapshot) throw new Error(data.error || "Quote could not be loaded");
        const quote = data.quote;
        const snap = quote.snapshot;
        document.title = `${snap.quote_number} — Solectrics`;
        document.getElementById("backLink").href = `/mini-fergus-job?id=${encodeURIComponent(snap.job_id)}`;
        content.innerHTML = `
          <header><div><div class="brand">solectrics</div><div>Electrical &amp; solar solutions</div></div><div class="meta"><h1>QUOTE</h1><strong>${escapeHtml(snap.quote_number)}</strong><br>${new Date(snap.generated_at).toLocaleDateString("en-NZ")}<br>Status: ${escapeHtml(quote.status).toUpperCase()}</div></header>
          <section class="customer"><div><h2>Prepared for</h2><strong>${escapeHtml(snap.customer.name)}</strong><br>${escapeHtml(snap.customer.address)}</div><div><h2>Contact</h2>${escapeHtml(snap.customer.email)}<br>${escapeHtml(snap.customer.phone)}</div></section>
          ${snap.options.map(option => `<section class="option"><h2>${escapeHtml(option.name)}</h2><table><thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th class="number">Price ex GST</th></tr></thead><tbody>${option.lines.map(line => `<tr><td>${escapeHtml(line.description)}</td><td>${Number(line.quantity)}</td><td>${escapeHtml(line.unit)}</td><td class="number">${money(line.total)}</td></tr>`).join("") || `<tr><td colspan="4">Included supply and installation</td></tr>`}</tbody></table><div class="totals"><div class="total-row"><span>Subtotal ex GST</span><strong>${money(option.subtotal_ex_gst)}</strong></div><div class="total-row"><span>GST</span><strong>${money(option.gst)}</strong></div><div class="total-row grand"><span>Total incl GST</span><strong>${money(option.total_incl_gst)}</strong></div></div></section>`).join("")}
          <p class="notice">This quote is a saved version. Please contact Solectrics if you would like to accept an option or discuss any changes.</p>`;
      } catch (error) { content.innerHTML = `<h1>Quote unavailable</h1><p>${escapeHtml(error.message)}</p>`; }
    }
    loadQuote();
  </script>
</body>
</html>
