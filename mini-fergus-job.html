<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Fergus Job | Solectrics</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5ef;
      color: #263a36;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .eyebrow {
      color: #e97838;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .back {
      display: inline-block;
      margin: 34px 0;
      color: #e97838;
      font-weight: 700;
      text-decoration: none;
    }

    h1 {
      font-size: 48px;
      margin: 5px 0 8px;
    }

    .address {
      font-size: 21px;
      color: #68746f;
      margin-bottom: 28px;
    }

    .status {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: #fff0e7;
      color: #e76625;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      border: 1px solid #ddd8cf;
      border-radius: 24px;
      padding: 32px 36px;
      margin: 24px 0;
    }

    h2 {
      margin: 0 0 25px;
      font-size: 25px;
    }

    h3 {
      margin: 28px 0 14px;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px 40px;
    }

    .label {
      color: #68746f;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .value {
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .answer-box {
      background: #faf9f5;
      border-radius: 16px;
      padding: 20px;
      margin-top: 14px;
      line-height: 1.6;
    }

    .answers-list {
      margin: 0;
      padding-left: 20px;
    }

    .answers-list li {
      margin: 7px 0;
    }

    .placeholder {
      color: #68746f;
      line-height: 1.6;
    }

    .site-visit input:not([type="checkbox"]),
    .site-visit select,
    .site-visit textarea {
      width: 100%;
      min-height: 40px;
    }

    .site-visit textarea {
      min-height: 80px;
    }

    .job-files input:not([type="file"]),
    .job-files select,
    .job-files textarea,
    .job-files input[type="file"] {
      width: 100%;
      min-height: 40px;
    }

    .job-file-row {
      border-top: 1px solid #e6e1d8;
      padding: 14px 0;
    }

    .job-file-row a {
      color: #e76625;
      font-weight: 700;
    }

    .job-file-selection {
      border-top: 1px solid #e6e1d8;
      margin-top: 16px;
    }

    .job-file-selection-row {
      border-bottom: 1px solid #e6e1d8;
      padding: 12px 0;
    }

    .job-file-selection-name {
      font-weight: 700;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .quote-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .quote-box {
      border: 1px solid #ddd8cf;
      border-radius: 16px;
      padding: 18px;
    }

    .quote-box strong {
      display: block;
      margin-bottom: 6px;
    }

    .error {
      color: #a12d2d;
    }

    @media (max-width: 700px) {
      .grid,
      .quote-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 38px;
      }

      .card {
        padding: 25px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <div class="brand">solectrics</div>
    <div class="eyebrow">Internal workspace</div>

    <a class="back" href="/mini-fergus">← Back to Mini Fergus</a>

    <div id="page">
      Loading job...
    </div>

  </main>

  <script>
    function formatStatus(status) {
      if (!status) return "New enquiry";

      return status
        .replace(/_/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function prettyLabel(key) {
      return key
        .replace(/([A-Z])/g, " $1")
        .replace(/_/g, " ")
        .replace(/^./, char => char.toUpperCase());
    }

    function prettyValue(value) {
      if (Array.isArray(value)) {
        return value.join(", ");
      }
if (typeof value === "object" && value !== null) {
  return Object.entries(value)
    .map(([key, val]) => `${prettyLabel(key)}: ${prettyValue(val)}`)
    .join(" • ");
}
      if (value === true) return "Yes";
      if (value === false) return "No";
      if (value === null || value === undefined || value === "") return "Not provided";

      return String(value);
    }

    function renderObject(obj) {
      if (!obj || typeof obj !== "object") {
        return `<div class="placeholder">No information provided.</div>`;
      }

      const entries = Object.entries(obj);

      if (!entries.length) {
        return `<div class="placeholder">No information provided.</div>`;
      }

      return `
        <div class="grid">
          ${entries.map(([key, value]) => `
            <div>
              <div class="label">${escapeHtml(prettyLabel(key))}</div>
              <div class="value">${escapeHtml(prettyValue(value))}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function parseAnswers(raw) {
      if (!raw) return {};

      if (typeof raw === "object") {
        return raw;
      }

      try {
        return JSON.parse(raw);
      } catch (error) {
        return { answers: raw };
      }
    }
const params = new URLSearchParams(window.location.search);
const jobId = params.get("id");
  let currentAnswers = {};

async function loadJob() {
  const page = document.getElementById("page");

      if (!jobId) {
        page.innerHTML = `
          <section class="card error">
            No job ID was supplied.
          </section>
        `;
        return;
      }

      try {
        const response = await fetch(`/api/job?id=${encodeURIComponent(jobId)}`);
        const data = await response.json();

        if (!response.ok || !data.ok || !data.job) {
          throw new Error(data.error || "Job could not be loaded");
        }

        const job = data.job;
        currentAnswers = parseAnswers(job.answers_json);
        
const answers = currentAnswers;
        
window.currentAnswers = answers;
        
        const loads = answers.loads || [];
        const home = {
          "People": answers.people,
          "Home type": answers.homeType,
          "Daytime use": answers.dayHome,
          "Hot water": answers.hotWater,
          "Meter": answers.meter,
          "Shade": answers.shade
        };

        page.innerHTML = `
          <h1>${escapeHtml(job.customer_name || "Customer")}</h1>
          <div class="address">${escapeHtml(job.address || "")}</div>

          <div class="status">${escapeHtml(formatStatus(job.job_status))}</div>

          <section class="card">
            <h2>Customer</h2>

            <div class="grid">
              <div>
                <div class="label">Email</div>
                <div class="value">${escapeHtml(job.email || "Not provided")}</div>
              </div>

              <div>
                <div class="label">Phone</div>
                <div class="value">${escapeHtml(job.phone || "Not provided")}</div>
              </div>

              <div>
                <div class="label">Address</div>
                <div class="value">${escapeHtml(job.address || "Not provided")}</div>
              </div>

              <div>
                <div class="label">Enquiry reference</div>
                <div class="value">${escapeHtml(job.enquiry_ref || "Not provided")}</div>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>Next action</h2>
            <div class="value">
              ${escapeHtml(job.next_action || "Review Home Energy Check")}
            </div>
          </section>

          <section class="card">
            <h2>Home Energy Check</h2>

            <h3>Home & energy use</h3>

            <div class="grid">
              ${Object.entries(home).map(([key, value]) => `
                <div>
                  <div class="label">${escapeHtml(key)}</div>
                  <div class="value">${escapeHtml(prettyValue(value))}</div>
                </div>
              `).join("")}
            </div>

            <h3>Electrical loads</h3>

            <div class="answer-box">
              ${
                loads.length
                  ? `<ul class="answers-list">
                      ${loads.map(load => `<li>${escapeHtml(load)}</li>`).join("")}
                    </ul>`
                  : "No loads provided."
              }
            </div>

            <h3>All Home Energy Check answers</h3>

            <div class="answer-box">
              ${renderObject(answers)}
            </div>
          </section>

          <section class="card">
  <h2>Assessment & design</h2>

  <div class="placeholder">
    Review the Home Energy Check and develop the recommended
    solar-smart solution.
  </div>

  <form id="assessmentForm">

<h3>Solar design</h3>

<div class="grid">

  <div>
    <label>Panel wattage (W)</label>
    <input type="number" id="panel_wattage" value="445">
  </div>

  <div>

    <input type="number" id="panel_count">
  </div>

  <div>

  </div>

  <div>
    <label>Roof / panel orientation</label>
    <select id="roof_orientation">
      <option value="">Select...</option>
      <option value="North">North</option>
      <option value="North-east">North-east</option>
      <option value="North-west">North-west</option>
      <option value="East">East</option>
      <option value="West">West</option>
      <option value="South-east">South-east</option>
      <option value="South-west">South-west</option>
      <option value="South">South</option>

    </select>
  </div>

  <div>
    <label>Inverter</label>
    <input type="text" id="inverter">
  </div>

  <div>

    <input type="number" id="estimated_generation_kwh">
    <div class="placeholder">

    </div>
  </div>

</div>


<h3>Smart energy use</h3>

<div class="placeholder">
  Mini Fergus can suggest how this home could use more of its own solar based on the Home Energy Check.
</div>

<div class="grid">

  <div>
    <label>Hot-water strategy</label>
    <textarea id="hot_water_strategy"
      placeholder="Suggested hot-water timing or control"></textarea>
  </div>

  <div>
    <label>Smart controls / load shifting</label>
    <textarea id="smart_controls"
      placeholder="Suggested loads to shift into solar-rich hours"></textarea>
  </div>

</div>


<h3>Battery</h3>

<div class="grid">

  <div>
    <label>Battery recommendation</label>
    <select id="battery_option">
      <option value="">Select...</option>
      <option value="Start without battery">Start without battery</option>
      <option value="Battery-ready">Battery-ready</option>
      <option value="Battery likely worthwhile">Battery likely worthwhile</option>
    </select>
  </div>

  <div>
    <label>Battery size (kWh)</label>
    <input type="number" step="0.1" id="battery_kwh">
  </div>

</div>

<label>Why?</label>
<textarea id="battery_reason"
  placeholder="Why this battery approach suits this home"></textarea>


<h3>Tariff review</h3>

<div class="grid">

  <div>
    <label>Current retailer</label>
    <input type="text" id="current_retailer">
  </div>

  <div>
    <label>Import rate (c/kWh)</label>
    <input type="number" step="0.01" id="import_rate">
  </div>

  <div>
    <label>Export / solar buy-back rate (c/kWh)</label>
    <input type="number" step="0.01" id="export_rate">
  </div>

  <div>
    <label>Controlled hot water</label>
    <select id="controlled_hot_water">
      <option value="">Unknown / not checked</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
      <option value="Not applicable">Not applicable</option>
    </select>
  </div>

  <div>
    <label>Recommended retailer / tariff</label>
    <input type="text" id="recommended_tariff">
  </div>

</div>

<label>Tariff notes</label>
<textarea id="tariff_notes"
  placeholder="Import pricing, solar buy-back, controlled-load considerations or tariff notes"></textarea>


<h3>Site notes</h3>

<textarea id="site_notes"
  placeholder="Roof, meter, switchboard, shading or anything to check on site"></textarea>


<h3>Overall recommendation</h3>

<div class="placeholder">
  Mini Fergus will assemble a concise recommendation from the design above. You can edit it before saving.
</div>

<textarea id="recommendation"
  placeholder="Recommended Solectrics solution"></textarea>

<br>

<button type="button" id="generateAssessment">
  GENERATE RECOMMENDATION
</button>

<button type="button" id="saveAssessment">
  SAVE ASSESSMENT
</button>

<span id="assessmentMessage"></span>

  </form>
</section>

<!-- TOM'S SITE VISIT -->

<section class="card site-visit" id="siteVisitSection">

function calculateSolarSize() {
  const panelWattage = Number(
    document.getElementById("panel_wattage")?.value || 0
  );

  const panelCount = Number(
    document.getElementById("panel_count")?.value || 0
  );

  const solarSize = document.getElementById("solar_kw");

  if (!solarSize) return;

  if (panelWattage > 0 && panelCount > 0) {
    solarSize.value =
      ((panelWattage * panelCount) / 1000).toFixed(2);
  } else {
    solarSize.value = "";
  }
}


function calculateEstimatedGeneration() {
  const solarKw = Number(
    document.getElementById("solar_kw")?.value || 0
  );

  const orientation =
    document.getElementById("roof_orientation")?.value || "";

  const generationField =
    document.getElementById("estimated_generation_kwh");

  if (!generationField || !solarKw) return;

  const orientationFactors = {
    "North": 1.00,
    "North-East": 0.95,
    "North-West": 0.95,
    "East": 0.88,
    "West": 0.88,
    "South-East": 0.78,
    "South-West": 0.78,
    "South": 0.65,
    "Mixed": 0.90
  };

  const factor = orientationFactors[orientation] ?? 0.90;

  // Practical first-pass Auckland/Waiheke estimate.
  // This remains editable and can later be replaced by OpenSolar data.
  const annualGeneration =
    Math.round(solarKw * 1250 * factor);

  generationField.value = annualGeneration;
}


function suggestSmartEnergyUse() {
  const hotWaterField = document.getElementById("hot_water_strategy");
  const controlsField = document.getElementById("smart_controls");

  if (!hotWaterField || !controlsField) return;

  const loads = Array.isArray(currentAnswers?.loads)
    ? currentAnswers.loads
    : [];

  const hotWater = String(currentAnswers?.hotWater || "").toLowerCase();
  const dayHome = String(currentAnswers?.dayHome || "").toLowerCase();

  const hasLoad = (text) =>
    loads.some(load =>
      String(load).toLowerCase().includes(text.toLowerCase())
    );

  // HOT WATER
  if (hotWater.includes("electric")) {
    hotWaterField.value =
      "Shift electric hot-water heating into solar-rich daytime hours, ideally around 10am–3pm where practical. Check the existing meter, ripple-control and cylinder arrangement before selecting the final control strategy.";
  } else {
    hotWaterField.value =
      "No electric hot-water load identified for solar shifting.";
  }

  // SMART LOAD SHIFTING
  const suggestions = [];

  if (hasLoad("washing machine")) {
    suggestions.push("washing machine");
  }

  if (hasLoad("dishwasher")) {
    suggestions.push("dishwasher");
  }

  if (hasLoad("heat pump") || hasLoad("electric heating")) {
    suggestions.push("heat pump / electric heating");
  }

  if (hasLoad("EV")) {
    suggestions.push("EV charging");
  }

  if (suggestions.length) {
    controlsField.value =
      "Prioritise direct solar use and shift " +
      suggestions.join(", ") +
      " into solar-rich daytime hours where practical" +
      (dayHome.includes("usually") || dayHome.includes("someone")
        ? ". Daytime occupancy should make direct use of solar easier."
        : ".");
  } else {
    controlsField.value =
      "Prioritise direct use of solar during the day and consider automatic load shifting where suitable.";
  }
}


function suggestBattery() {
  const batteryOption = document.getElementById("battery_option");
  const batteryReason = document.getElementById("battery_reason");

  if (!batteryOption || !batteryReason) return;

  const answers = currentAnswers || {};
  const loads = Array.isArray(answers.loads) ? answers.loads : [];

  const goalsText = String(answers.goals || "").toLowerCase();
  const dayHomeText = String(answers.dayHome || "").toLowerCase();
  const hotWaterText = String(answers.hotWater || "").toLowerCase();

  const hasDaytimeOccupancy =
    dayHomeText.includes("usually someone home") ||
    dayHomeText.includes("someone home");

  const hasElectricHotWater =
    hotWaterText.includes("electric");

  const hasShiftableLoads = loads.some(load => {
    const text = String(load).toLowerCase();
    return (
      text.includes("washing") ||
      text.includes("dishwasher") ||
      text.includes("heat pump") ||
      text.includes("electric heating") ||
      text.includes("ev")
    );
  });

  const wantsBackup =
    goalsText.includes("backup") ||
    goalsText.includes("power cut") ||
    goalsText.includes("resilience");

  const billsKnown =
    answers.bills &&
    String(answers.bills).toLowerCase().includes("not provided") === false;

  if (wantsBackup) {
    batteryOption.value = "Battery likely worthwhile";
    batteryReason.value =
      "A battery is worth investigating because backup or energy resilience is an important goal for this home. Final battery size should be based on essential backup loads and expected solar surplus.";
  } else if (hasDaytimeOccupancy || hasElectricHotWater || hasShiftableLoads) {
    batteryOption.value = "Start without battery";
    batteryReason.value =
      "This home has good opportunities to use solar directly during the day, particularly through hot water, appliances and heating. Design the system battery-ready and review actual solar export and evening grid use after installation before deciding whether storage provides worthwhile additional value.";
  } else if (!billsKnown) {
    batteryOption.value = "Battery-ready";
    batteryReason.value =
      "There is not yet enough consumption information to justify a battery on savings alone. Design the system battery-ready and review electricity bills or actual solar export and evening grid use before selecting storage.";
  } else {
    batteryOption.value = "Battery-ready";
    batteryReason.value =
      "This home may have useful solar surplus available for evening use. Design the system battery-ready, then confirm the value and appropriate battery size from consumption patterns and expected export.";
  }
}

function applySiteVisitToSystemDesign(visit) {
  const fieldMap = {
    visit_connection_type: "design_connection_type",
    visit_main_supply: "design_main_supply",
    visit_icp: "design_icp",
    visit_retailer: "design_retailer",
    visit_network: "design_network",
    visit_switchboard: "design_switchboard",
    visit_supply_notes: "design_supply_notes"
  };

  Object.entries(fieldMap).forEach(([sourceId, targetId]) => {
    const target = document.getElementById(targetId);
    if (target) target.value = visit[sourceId] ?? "";
  });

  const checkboxMap = {
    visit_salt_spray: "design_salt_spray",
    visit_high_wind: "design_high_wind",
    visit_trees: "design_trees",
    visit_chimneys: "design_chimneys",
    visit_buildings: "design_buildings",
    visit_aerials: "design_aerials",
    visit_vents: "design_vents",
    visit_satellite: "design_satellite"
  };

  Object.entries(checkboxMap).forEach(([sourceId, targetId]) => {
    const target = document.getElementById(targetId);
    if (target) target.checked = Boolean(visit[sourceId]);
  });

  const firstRoof = document.querySelector("#designRoofs .design-roof");
  const roofMap = {
    visit_roof_length: "roof_length",
    visit_roof_width: "roof_width",
    visit_roof_pitch: "roof_pitch",
    visit_roof_orientation: "roof_orientation_design",
    visit_roof_material: "roof_material",
    visit_roof_panel_count: "roof_panel_count",
    visit_roof_layout: "roof_array_layout",
    visit_roof_shading: "roof_shading",
    visit_roof_notes: "roof_notes"
  };

  Object.entries(roofMap).forEach(([sourceId, targetClass]) => {
    const target = firstRoof?.querySelector(`.${targetClass}`);
    if (target) target.value = visit[sourceId] ?? "";
  });

  const environmentNotes = [
    visit.visit_roof_access && `Roof access: ${visit.visit_roof_access}`,
    visit.visit_inverter_location && `Possible inverter location: ${visit.visit_inverter_location}`,
    visit.visit_battery_location && `Possible battery location: ${visit.visit_battery_location}`,
    visit.visit_cable_route && `Likely cable route: ${visit.visit_cable_route}`,
    visit.visit_access_notes && `Access / safety: ${visit.visit_access_notes}`,
    visit.visit_general_notes
  ].filter(Boolean).join("\n");

  const environmentField = document.getElementById("design_environment_notes");
  if (environmentField) environmentField.value = environmentNotes;

  if (visit.visit_roof_panel_count) {
    const panelCount = document.getElementById("design_panel_count");
    if (panelCount) panelCount.value = visit.visit_roof_panel_count;
  }

  const wattage = Number(document.getElementById("design_panel_wattage")?.value) || 0;
  const panelCount = Number(document.getElementById("design_panel_count")?.value) || 0;
  const arraySize = document.getElementById("design_array_kw");
  if (arraySize) {
    arraySize.value = wattage > 0 && panelCount > 0
      ? ((wattage * panelCount) / 1000).toFixed(3)
      : "";
  }
}

function formatFileSize(bytes) {
  const size = Number(bytes) || 0;
  if (size < 1024) return `${size} B`;
  if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
  return `${(size / (1024 * 1024)).toFixed(1)} MB`;
}

function renderSelectedJobFiles() {
  const input = document.getElementById("jobFileInput");
  const selection = document.getElementById("jobFileSelection");
  const files = Array.from(input.files || []);

  if (!files.length) {
    selection.hidden = true;
    selection.replaceChildren();
    return;
  }

  selection.hidden = false;
  selection.innerHTML = files.map((file, index) => `
    <div class="job-file-selection-row">
      <div class="job-file-selection-name">
        ${escapeHtml(file.name)} · ${escapeHtml(formatFileSize(file.size))}
      </div>
      <label for="jobFileCaption${index}">Caption / what this shows (optional)</label>
      <input type="text" id="jobFileCaption${index}" data-job-file-caption="${index}"
        maxlength="500" placeholder="Type or dictate a note for this photo">

async function loadJobFiles() {
  const list = document.getElementById("jobFilesList");
  try {
    const response = await fetch(`/api/job-files?job_id=${jobId}`);
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "Load failed");

    if (!data.files.length) {
      list.className = "placeholder";

    list.className = "";

          ${escapeHtml(file.original_name)}
        </a>
        <div class="placeholder">
          ${escapeHtml(jobFileCategoryLabels[file.category] || "Other")}
          · ${escapeHtml(formatFileSize(file.size_bytes))}
          · ${escapeHtml(file.uploaded_at || "")}
        </div>
        ${file.caption ? `<div>${escapeHtml(file.caption)}</div>` : ""}
      </div>

async function uploadJobFile() {
  const input = document.getElementById("jobFileInput");
  const message = document.getElementById("jobFileMessage");
  const files = Array.from(input.files || []);

  if (!files.length) {
    message.textContent = " Choose one or more photos or PDFs first";
    return;
  }

  const oversizedFile = files.find(file => file.size > 12 * 1024 * 1024);
  if (oversizedFile) {
    message.textContent = ` ${oversizedFile.name} is over the 12 MB limit`;
    return;
  }

  const category = document.getElementById("jobFileCategory").value;
  const uploadButton = document.getElementById("uploadJobFile");
  uploadButton.disabled = true;

  try {
    for (let index = 0; index < files.length; index += 1) {
      const file = files[index];
      const caption = document.querySelector(
        `[data-job-file-caption="${index}"]`
      )?.value || "";
      const form = new FormData();
      form.append("job_id", jobId);
      form.append("file", file);
      form.append("category", category);
      form.append("caption", caption);
      message.textContent = ` Uploading ${index + 1} of ${files.length}...`;

      const response = await fetch("/api/job-files", { method: "POST", body: form });
      const data = await response.json();
      if (!response.ok || !data.ok) {
        throw new Error(data.detail || data.error || `Could not upload ${file.name}`);
      }
    }

    input.value = "";
    renderSelectedJobFiles();
    message.textContent = ` ✓ ${files.length} file${files.length === 1 ? "" : "s"} uploaded`;
    await loadJobFiles();
  } catch (error) {
    console.error("Could not upload job file:", error);
    message.textContent = ` Could not upload: ${error.message}`;
  } finally {
    uploadButton.disabled = false;
  }
}

      if (field) field.checked = Boolean(design[id]);
    });

    const roofsContainer = document.getElementById("designRoofs");
    const roofs = Array.isArray(design.roofs) && design.roofs.length
      ? design.roofs
      : [{}];

    while (roofsContainer.children.length > 1) {
      roofsContainer.lastElementChild.remove();
    }

    populateRoof(roofsContainer.querySelector(".design-roof"), roofs[0]);
    for (const roofData of roofs.slice(1)) {
      document.getElementById("addDesignRoof").click();
      populateRoof(roofsContainer.lastElementChild, roofData);
    }

    updateSystemDesignReadiness();
  } catch (error) {
    console.error("Could not load system design:", error);
    const message = document.getElementById("systemDesignMessage");
    if (message) message.textContent = " Could not load saved system design";
  }
}

async function saveSystemDesign() {
  const message = document.getElementById("systemDesignMessage");
  message.textContent = " Saving...";

  try {
    const response = await fetch("/api/system-design", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        job_id: jobId,
        system_design: collectSystemDesign()
      })
    });
    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.error || "Save failed");
    }

    message.textContent = " ✓ System design saved";
    updateSystemDesignReadiness();
    return true;
  } catch (error) {
    console.error("Could not save system design:", error);
    message.textContent = " Could not save system design";
    return false;
  }
}

}


document.addEventListener("input", function(event) {

  if (!event.target) return;


  /* ASSESSMENT & DESIGN */

  if (
    event.target.id === "panel_wattage" ||
    event.target.id === "panel_count"
  ) {
    updateDesignSuggestions();

    const assessmentWattage =
      document.getElementById("panel_wattage");

    const assessmentCount =
      document.getElementById("panel_count");

    const designWattage =
      document.getElementById("design_panel_wattage");

    const designCount =
      document.getElementById("design_panel_count");

    if (assessmentWattage && designWattage) {
      designWattage.value = assessmentWattage.value || "";
    }

    if (assessmentCount && designCount) {
      designCount.value = assessmentCount.value || "";
    }
    
const designArraySize =
  document.getElementById("design_array_kw");

if (designArraySize && designWattage && designCount) {
  const wattage = Number(designWattage.value) || 0;
  const panelCount = Number(designCount.value) || 0;

  if (wattage > 0 && panelCount > 0) {
    designArraySize.value =
      ((wattage * panelCount) / 1000).toFixed(3);
  } else {
    designArraySize.value = "";
  }
}

  }

  /* SYSTEM DESIGN — CALCULATE ARRAY SIZE */

  if (
    event.target.id === "design_panel_wattage" ||
    event.target.id === "design_panel_count" ||
    event.target.classList.contains("roof_panel_count")
  ) {

    const wattage =
      Number(document.getElementById("design_panel_wattage")?.value) || 0;

    const panelCount =
      Number(document.getElementById("design_panel_count")?.value) || 0;

    const arraySize =
      document.getElementById("design_array_kw");

    if (arraySize) {

      if (wattage > 0 && panelCount > 0) {
        arraySize.value =
          ((wattage * panelCount) / 1000).toFixed(3);
      } else {
        arraySize.value = "";
      }

    }

  }

  /* SUPPLIER PRICING — CALCULATE MATERIAL COSTS */

  const supplierCostFields = [
    "supplier_cost_panels",
    "supplier_cost_inverter",
    "supplier_cost_battery",
    "supplier_cost_gateway",
    "supplier_cost_mounting",
    "supplier_cost_misc",
    "supplier_cost_freight",
    "supplier_cost_other"
  ];

  const solectricsMaterialFields = [
    "solectrics_cable_cost",
    "solectrics_conduit_cost",
    "solectrics_switchgear_cost",
    "solectrics_other_materials"
  ];

  if (
    supplierCostFields.includes(event.target.id) ||
    solectricsMaterialFields.includes(event.target.id)
  ) {

    const supplierSubtotal = supplierCostFields.reduce(
      (total, id) =>
        total + (Number(document.getElementById(id)?.value) || 0),
      0
    );

    const supplierSubtotalField =
      document.getElementById("supplier_subtotal");

    if (supplierSubtotalField) {
      supplierSubtotalField.value = supplierSubtotal.toFixed(2);
    }


    const additionalMaterials = solectricsMaterialFields.reduce(
      (total, id) =>
        total + (Number(document.getElementById(id)?.value) || 0),
      0
    );

    const trueMaterialsCost =
      supplierSubtotal + additionalMaterials;

    const trueMaterialsDisplay =
      document.getElementById("trueMaterialsCost");

    if (trueMaterialsDisplay) {
      trueMaterialsDisplay.textContent =
        trueMaterialsCost.toFixed(2);
    }

  }
});
