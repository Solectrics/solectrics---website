<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job | Mini Fergus | Solectrics</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5ef;
      color: #263a36;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .eyebrow {
      color: #e97838;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .back {
      display: inline-block;
      color: #e97838;
      text-decoration: none;
      font-weight: 700;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 6px;
    }

    .address {
      color: #68736f;
      font-size: 19px;
      margin-bottom: 24px;
    }

    .status {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 999px;
      background: #fff0e7;
      color: #df682c;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .card {
      background: white;
      border: 1px solid #dedbd2;
      border-radius: 22px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 20px;
      font-size: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .label {
      color: #68736f;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 17px;
      font-weight: 600;
      word-break: break-word;
    }

    .next-action {
      font-size: 20px;
      font-weight: 800;
    }

    .placeholder {
      color: #68736f;
      line-height: 1.6;
    }

    .error {
      color: #a53c2e;
    }

    @media (max-width: 650px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 34px; }
      .wrap { padding: 28px 18px 60px; }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <div class="brand">solectrics</div>
    <div class="eyebrow">Internal workspace</div>

    <a class="back" href="/mini-fergus">← Back to Mini Fergus</a>

    <div id="job-page">
      <div class="card">Loading job…</div>
    </div>

  </main>

  <script>
    function formatStatus(status) {
      if (!status) return "New enquiry";

      return status
        .replaceAll("_", " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    async function loadJob() {
      const page = document.getElementById("job-page");
      const params = new URLSearchParams(window.location.search);
      const jobId = params.get("id");

      if (!jobId) {
        page.innerHTML = `
          <div class="card error">
            No job was selected.
          </div>
        `;
        return;
      }

      try {
        const response = await fetch("/api/jobs");
        const data = await response.json();

        if (!data.ok) {
          throw new Error(data.error || "Could not load jobs");
        }

        const job = data.jobs.find(
          item => String(item.job_id) === String(jobId)
        );

        if (!job) {
          page.innerHTML = `
            <div class="card error">
              Job not found.
            </div>
          `;
          return;
        }

        page.innerHTML = `
          <h1>${job.customer_name || "Unnamed customer"}</h1>
          <div class="address">${job.address || ""}</div>
          <div class="status">${formatStatus(job.job_status)}</div>

          <section class="card">
            <h2>Customer</h2>

            <div class="grid">
              <div>
                <div class="label">Email</div>
                <div class="value">${job.email || "—"}</div>
              </div>

              <div>
                <div class="label">Phone</div>
                <div class="value">${job.phone || "—"}</div>
              </div>

              <div>
                <div class="label">Address</div>
                <div class="value">${job.address || "—"}</div>
              </div>

              <div>
                <div class="label">Enquiry reference</div>
                <div class="value">${job.enquiry_ref || "—"}</div>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>Next action</h2>
            <div class="next-action">
              ${job.next_action || "Review job"}
            </div>
          </section>

          <section class="card">
            <h2>Home Energy Check</h2>
            <div class="placeholder">
              Next we'll bring the customer's Home Energy Check answers,
              electricity information and uploaded bill into this job.
            </div>
          </section>

          <section class="card">
            <h2>Assessment & design</h2>
            <div class="placeholder">
              Site assessment, solar design, tariff review and recommendations
              will live here.
            </div>
          </section>

          <section class="card">
            <h2>Quote & installation</h2>
            <div class="placeholder">
              Quote, acceptance, deposit, network/retailer steps, installation
              checklist and certification will live here.
            </div>
          </section>
        `;

      } catch (error) {
        console.error(error);

        page.innerHTML = `
          <div class="card error">
            This job couldn't be loaded. Please return to Mini Fergus and try again.
          </div>
        `;
      }
    }

    loadJob();
  </script>
</body>
</html>
