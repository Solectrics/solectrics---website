<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Fergus Job | Solectrics</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5ef;
      color: #263a36;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .eyebrow {
      color: #e97838;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .back {
      display: inline-block;
      margin: 34px 0;
      color: #e97838;
      font-weight: 700;
      text-decoration: none;
    }

    h1 {
      font-size: 48px;
      margin: 5px 0 8px;
    }

    .address {
      font-size: 21px;
      color: #68746f;
      margin-bottom: 28px;
    }

    .status {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: #fff0e7;
      color: #e76625;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      border: 1px solid #ddd8cf;
      border-radius: 24px;
      padding: 32px 36px;
      margin: 24px 0;
    }

    h2 {
      margin: 0 0 25px;
      font-size: 25px;
    }

    h3 {
      margin: 28px 0 14px;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px 40px;
    }

    .label {
      color: #68746f;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .value {
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .answer-box {
      background: #faf9f5;
      border-radius: 16px;
      padding: 20px;
      margin-top: 14px;
      line-height: 1.6;
    }

    .answers-list {
      margin: 0;
      padding-left: 20px;
    }

    .answers-list li {
      margin: 7px 0;
    }

    .placeholder {
      color: #68746f;
      line-height: 1.6;
    }

    .quote-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .quote-box {
      border: 1px solid #ddd8cf;
      border-radius: 16px;
      padding: 18px;
    }

    .quote-box strong {
      display: block;
      margin-bottom: 6px;
    }

    .error {
      color: #a12d2d;
    }

    @media (max-width: 700px) {
      .grid,
      .quote-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 38px;
      }

      .card {
        padding: 25px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <div class="brand">solectrics</div>
    <div class="eyebrow">Internal workspace</div>

    <a class="back" href="/mini-fergus">← Back to Mini Fergus</a>

    <div id="page">
      Loading job...
    </div>

  </main>

  <script>
    function formatStatus(status) {
      if (!status) return "New enquiry";

      return status
        .replace(/_/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function prettyLabel(key) {
      return key
        .replace(/([A-Z])/g, " $1")
        .replace(/_/g, " ")
        .replace(/^./, char => char.toUpperCase());
    }

    function prettyValue(value) {
      if (Array.isArray(value)) {
        return value.join(", ");
      }
if (typeof value === "object" && value !== null) {
  return Object.entries(value)
    .map(([key, val]) => `${prettyLabel(key)}: ${prettyValue(val)}`)
    .join(" • ");
}
      if (value === true) return "Yes";
      if (value === false) return "No";
      if (value === null || value === undefined || value === "") return "Not provided";

      return String(value);
    }

    function renderObject(obj) {
      if (!obj || typeof obj !== "object") {
        return `<div class="placeholder">No information provided.</div>`;
      }

      const entries = Object.entries(obj);

      if (!entries.length) {
        return `<div class="placeholder">No information provided.</div>`;
      }

      return `
        <div class="grid">
          ${entries.map(([key, value]) => `
            <div>
              <div class="label">${escapeHtml(prettyLabel(key))}</div>
              <div class="value">${escapeHtml(prettyValue(value))}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function parseAnswers(raw) {
      if (!raw) return {};

      if (typeof raw === "object") {
        return raw;
      }

      try {
        return JSON.parse(raw);
      } catch (error) {
        return { answers: raw };
      }
    }
const params = new URLSearchParams(window.location.search);
const jobId = params.get("id");
  

async function loadJob() {
  const page = document.getElementById("page");

      if (!jobId) {
        page.innerHTML = `
          <section class="card error">
            No job ID was supplied.
          </section>
        `;
        return;
      }

      try {
        const response = await fetch(`/api/job?id=${encodeURIComponent(jobId)}`);
        const data = await response.json();

        if (!response.ok || !data.ok || !data.job) {
          throw new Error(data.error || "Job could not be loaded");
        }

        const job = data.job;
        const answers = parseAnswers(job.answers_json);

        const loads = answers.loads || [];
        const home = {
          "People": answers.people,
          "Home type": answers.homeType,
          "Daytime use": answers.dayHome,
          "Hot water": answers.hotWater,
          "Meter": answers.meter,
          "Shade": answers.shade
        };

        page.innerHTML = `
          <h1>${escapeHtml(job.customer_name || "Customer")}</h1>
          <div class="address">${escapeHtml(job.address || "")}</div>

          <div class="status">${escapeHtml(formatStatus(job.job_status))}</div>

          <section class="card">
            <h2>Customer</h2>

            <div class="grid">
              <div>
                <div class="label">Email</div>
                <div class="value">${escapeHtml(job.email || "Not provided")}</div>
              </div>

              <div>
                <div class="label">Phone</div>
                <div class="value">${escapeHtml(job.phone || "Not provided")}</div>
              </div>

              <div>
                <div class="label">Address</div>
                <div class="value">${escapeHtml(job.address || "Not provided")}</div>
              </div>

              <div>
                <div class="label">Enquiry reference</div>
                <div class="value">${escapeHtml(job.enquiry_ref || "Not provided")}</div>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>Next action</h2>
            <div class="value">
              ${escapeHtml(job.next_action || "Review Home Energy Check")}
            </div>
          </section>

          <section class="card">
            <h2>Home Energy Check</h2>

            <h3>Home & energy use</h3>

            <div class="grid">
              ${Object.entries(home).map(([key, value]) => `
                <div>
                  <div class="label">${escapeHtml(key)}</div>
                  <div class="value">${escapeHtml(prettyValue(value))}</div>
                </div>
              `).join("")}
            </div>

            <h3>Electrical loads</h3>

            <div class="answer-box">
              ${
                loads.length
                  ? `<ul class="answers-list">
                      ${loads.map(load => `<li>${escapeHtml(load)}</li>`).join("")}
                    </ul>`
                  : "No loads provided."
              }
            </div>

            <h3>All Home Energy Check answers</h3>

            <div class="answer-box">
              ${renderObject(answers)}
            </div>
          </section>

          <section class="card">
  <h2>Assessment & design</h2>

  <div class="placeholder">
    Review the Home Energy Check and develop the recommended
    solar-smart solution.
  </div>

  <form id="assessmentForm">

<h3>Solar design</h3>

<div class="grid">

  <div>
    <label>Panel wattage (W)</label>
    <input type="number" id="panel_wattage" value="445">
  </div>

  <div>
    <label>Number of panels</label>
    <input type="number" id="panel_count">
  </div>

  <div>
    <label>Solar array size (kWp)</label>
    <input type="number" step="0.01" id="solar_kw" readonly>
  </div>

  <div>
    <label>Roof / panel orientation</label>
    <select id="roof_orientation">
      <option value="">Select...</option>
      <option value="North">North</option>
      <option value="North-east">North-east</option>
      <option value="North-west">North-west</option>
      <option value="East">East</option>
      <option value="West">West</option>
      <option value="South-east">South-east</option>
      <option value="South-west">South-west</option>
      <option value="South">South</option>
      <option value="Mixed">Mixed orientations</option>
    </select>
  </div>

  <div>
    <label>Inverter</label>
    <input type="text" id="inverter">
  </div>

  <div>
    <label>Estimated annual generation (kWh)</label>
    <input type="number" id="estimated_generation_kwh">
    <div class="placeholder">
      Preliminary estimate — editable if a detailed solar design gives a better figure.
    </div>
  </div>

</div>


<h3>Smart energy use</h3>

<div class="placeholder">
  Mini Fergus can suggest how this home could use more of its own solar based on the Home Energy Check.
</div>

<div class="grid">

  <div>
    <label>Hot-water strategy</label>
    <textarea id="hot_water_strategy"
      placeholder="Suggested hot-water timing or control"></textarea>
  </div>

  <div>
    <label>Smart controls / load shifting</label>
    <textarea id="smart_controls"
      placeholder="Suggested loads to shift into solar-rich hours"></textarea>
  </div>

</div>


<h3>Battery</h3>

<div class="grid">

  <div>
    <label>Battery recommendation</label>
    <select id="battery_option">
      <option value="">Select...</option>
      <option value="Start without battery">Start without battery</option>
      <option value="Battery-ready">Battery-ready</option>
      <option value="Battery likely worthwhile">Battery likely worthwhile</option>
    </select>
  </div>

  <div>
    <label>Battery size (kWh)</label>
    <input type="number" step="0.1" id="battery_kwh">
  </div>

</div>

<label>Why?</label>
<textarea id="battery_reason"
  placeholder="Why this battery approach suits this home"></textarea>


<h3>Tariff review</h3>

<div class="grid">

  <div>
    <label>Current retailer</label>
    <input type="text" id="current_retailer">
  </div>

  <div>
    <label>Import rate (c/kWh)</label>
    <input type="number" step="0.01" id="import_rate">
  </div>

  <div>
    <label>Export / solar buy-back rate (c/kWh)</label>
    <input type="number" step="0.01" id="export_rate">
  </div>

  <div>
    <label>Controlled hot water</label>
    <select id="controlled_hot_water">
      <option value="">Unknown / not checked</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
      <option value="Not applicable">Not applicable</option>
    </select>
  </div>

  <div>
    <label>Recommended retailer / tariff</label>
    <input type="text" id="recommended_tariff">
  </div>

</div>

<label>Tariff notes</label>
<textarea id="tariff_notes"
  placeholder="Import pricing, solar buy-back, controlled-load considerations or tariff notes"></textarea>


<h3>Site notes</h3>

<textarea id="site_notes"
  placeholder="Roof, meter, switchboard, shading or anything to check on site"></textarea>


<h3>Overall recommendation</h3>

<div class="placeholder">
  Mini Fergus will assemble a concise recommendation from the design above. You can edit it before saving.
</div>

<textarea id="recommendation"
  placeholder="Recommended Solectrics solution"></textarea>

<br>

<button type="button" id="generateAssessment">
  GENERATE RECOMMENDATION
</button>

<button type="button" id="saveAssessment">
  SAVE ASSESSMENT
</button>

<span id="assessmentMessage"></span>

  </form>
</section>

          <section class="card">
            <h2>Quote</h2>

            <div class="placeholder">
              Next we'll add the recommended system, price and a simple
              “Quote sent” action here.
            </div>
          </section>
        `;

      } catch (error) {
        console.error(error);

        page.innerHTML = `
          <section class="card error">
            This job couldn't be loaded. Please return to Mini Fergus and try again.
          </section>
        `;
      }
    }



    async function loadAssessment() {
  try {
    const response = await fetch(`/api/assessment?job_id=${jobId}`);
    const data = await response.json();

    if (!data.ok || !data.assessment) return;

    const a = data.assessment;

    document.getElementById("solar_kw").value = a.solar_kw ?? "";
    document.getElementById("panel_count").value = a.panel_count ?? "";
    document.getElementById("inverter").value = a.inverter ?? "";
    document.getElementById("estimated_generation_kwh").value =
      a.estimated_generation_kwh ?? "";
    document.getElementById("hot_water_strategy").value =
      a.hot_water_strategy ?? "";
    document.getElementById("smart_controls").value =
      a.smart_controls ?? "";
    document.getElementById("battery_option").value =
      a.battery_option ?? "";
    document.getElementById("battery_kwh").value =
      a.battery_kwh ?? "";
    document.getElementById("tariff_recommendation").value =
      a.tariff_recommendation ?? "";
    document.getElementById("site_notes").value =
      a.site_notes ?? "";
    document.getElementById("recommendation").value =
      a.recommendation ?? "";

  } catch (error) {
    console.error("Could not load assessment:", error);
  }
}


async function saveAssessment() {
  const message = document.getElementById("assessmentMessage");

  message.textContent = " Saving...";

  const assessment = {
    job_id: jobId,
    solar_kw: document.getElementById("solar_kw").value,
    panel_count: document.getElementById("panel_count").value,
    inverter: document.getElementById("inverter").value,
    estimated_generation_kwh:
      document.getElementById("estimated_generation_kwh").value,
    hot_water_strategy:
      document.getElementById("hot_water_strategy").value,
    smart_controls:
      document.getElementById("smart_controls").value,
    battery_option:
      document.getElementById("battery_option").value,
    battery_kwh:
      document.getElementById("battery_kwh").value,
    tariff_recommendation:
      document.getElementById("tariff_recommendation").value,
    site_notes:
      document.getElementById("site_notes").value,
    recommendation:
      document.getElementById("recommendation").value
  };

  try {
    const response = await fetch("/api/assessment", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(assessment)
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.error || "Save failed");
    }

    message.textContent = " ✓ Assessment saved";

  } catch (error) {
    console.error(error);
    message.textContent = " Could not save assessment";
  }
}


function calculateSolarSize() {
  const panelWattage = Number(
    document.getElementById("panel_wattage")?.value || 0
  );

  const panelCount = Number(
    document.getElementById("panel_count")?.value || 0
  );

  const solarSize = document.getElementById("solar_kw");

  if (!solarSize) return;

  if (panelWattage > 0 && panelCount > 0) {
    solarSize.value = ((panelWattage * panelCount) / 1000).toFixed(2);
  } else {
    solarSize.value = "";
  }
}

document.addEventListener("input", function(event) {
  if (
    event.target &&
    (event.target.id === "panel_wattage" ||
     event.target.id === "panel_count")
  ) {
    calculateSolarSize();
  }
});

document.addEventListener("click", function(event) {
  if (event.target && event.target.id === "saveAssessment") {
    saveAssessment();
  }
});

loadJob().then(() => {
  loadAssessment().then(() => calculateSolarSize());
});
  </script>
</body>
</html>
